<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>アイカツ！カードリスト</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

    </div>

  </main>


  <!-- =========================

  ========================= -->

  <nav class="bottom-nav">

    >

      <span class="nav-icon">
        ▣
      </span>

      <span class="nav-label">

      </span>

    </a>


    <a
      href="./trade/"

    >

      <span class="nav-icon">
        ⇄
      </span>

   <a

    <span class="add-circle">
     ＋
    </span>

    <span class="nav-label">

    >

      <span class="nav-icon">
        ◷
      </span>

      <span class="nav-label">

    <a

      class="bottom-nav-item"

      <span class="nav-label">
